[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = '0.8.34'
optimizer = true
optimizer_runs = 200
evm_version = 'cancun'
remappings = [
    "forge-std/=lib/forge-std/src/",
    "dss-test/=lib/dss-test/src/",
    "dss-interfaces/=lib/dss-test/lib/dss-interfaces/src/",
    "openzeppelin-contracts/=lib/nfat/lib/openzeppelin-contracts/",
]

[fuzz]
runs = 256

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
